version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - perfsprint
    - sloglint
    - goconst
    - errname
    - errorlint
    - modernize

  settings:
    perfsprint:
      strconcat: false

    sloglint:
      no-global: "all"
      attr-only: true

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

    modernize:
      disable: []

formatters:
  enable:
    - gofmt

run:
  go: "1.25"
